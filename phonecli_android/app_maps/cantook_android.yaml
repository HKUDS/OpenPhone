launch_behavior: always_home
common_tasks:
- View recently read publications
- Browse and download free ebooks from the catalog
- Import local files or folders into the library
- Customize app theme, language, and accent colors
- Add and manage external library catalogs via URL
- Configure loan alert notifications
- View detailed information about a selected book
- Browse books by categories such as authors and collections
known_limitations:
- Adding new library catalogs requires manually entering a URL in a dialog box
- Notification screens show an empty state if system-level permissions are not granted
- Opening certain files may trigger the Android system 'Open with' dialog, interrupting
  the in-app experience
- App store links open in an in-app web browser rather than launching the native store
  app directly
