launch_behavior: always_home
common_tasks:
- Connect to Wi-Fi and manage network preferences
- Pair and manage Bluetooth devices
- Check battery usage and enable Battery Saver
- Manage app permissions and notifications
- Free up device storage space
- Adjust volume levels and choose ringtones
- Set up a Wi-Fi hotspot or tethering
- Search for specific settings options
known_limitations:
- Some settings require an active internet connection and will show an error prompt
  if offline
- Deeply nested menus require multiple taps on the navigate up button to return to
  the main screen
- Freeing up storage space redirects the user to a separate Files app
- Some pages open in an in-app web view that requires closing a tab to navigate back
