common_tasks:
- View upcoming events
- Create a new calendar event
- Add a new task
- Set event date and time
- Configure event reminders and alerts
- Set event recurrence
- Navigate between Tasks, Calendar, and Events tabs
- Report an advertisement
known_limitations:
- App displays a Report Ad banner, indicating it is ad-supported
- Navigation tabs for Tasks, Calendar, and Events are redundantly presented across
  multiple screens
- Date selection requires navigating a monthly grid or using manual text input
