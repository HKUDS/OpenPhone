launch_behavior: always_home
common_tasks:
- Search for a specific contact
- Create a new contact
- Call, text, or video chat a contact
- Edit or update contact details
- Add or remove a contact from favorites
- Import or export contacts from a SIM card or account
- Block specific phone numbers
- Manage linked accounts and sync settings
known_limitations:
- Navigation is split between a bottom tab bar and a side drawer for different settings
  and labels
- Filtering contacts requires opening a dedicated filter menu rather than using quick
  toggles on the main list
- Selecting multiple contacts requires entering a specific contact selection mode
- Import and export tools are buried within the 'Fix & manage' or settings menus
