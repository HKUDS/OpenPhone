common_tasks:
- Create and configure a new alarm
- Add and search for cities in the World Clock
- Set up and start a countdown timer
- Use the stopwatch to track elapsed time
- Configure bedtime and sleep routines
- Change the clock display style between digital and analog
- Set the home time zone and date/time preferences
- Adjust alarm behaviors like snooze length and silence after duration
- Send app feedback with screenshots and system logs
known_limitations:
- Accessing help, privacy policies, or sending feedback redirects the user to a web
  browser interface
- Sending feedback requires granting system permissions to access device logs
- Bedtime feature requires completing an onboarding flow before it can be used
- App settings are deeply nested across multiple screens requiring several taps to
  navigate
