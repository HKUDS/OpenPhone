launch_behavior: always_home
common_tasks:
- Join a meeting using a meeting ID or invitation link
- Sign in or create a new Zoom account
- Configure default audio and video settings for meetings
- Manage app storage and clear cache files
- Access and read emails in the Zoom Mail inbox
- Adjust accessibility options such as dimming flashing images
- Activate a device using a QR code or activation code
- Update the Zoom Workplace application
known_limitations:
- Settings are spread across multiple categories like Meetings, Audio, Video, and
  General, requiring deep navigation.
- Authentication flows may redirect to external WebViews for OAuth or security verifications
  like Cloudflare.
- Joining a meeting involves an intermediate screen to configure audio and video preferences
  before entering.
