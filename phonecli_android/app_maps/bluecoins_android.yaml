launch_behavior: always_home
common_tasks:
- Add a new expense or income transaction
- View daily financial summaries and statistics
- Track and review budget summaries by category
- Check net worth and balance sheet
- View future financial projections
- Reconcile bank accounts and edit transactions
- Filter financial data by date range and transaction type
- Generate and view financial reports and charts
known_limitations:
- Initial launch may be interrupted by a bottom sheet prompting for phone storage
  or folder selection if the default folder is missing
- Navigation is spread across multiple distinct menu screens, requiring users to navigate
  through several layers to find specific sections
- Accessing detailed reports requires interacting with multiple nested filter menus
  and bottom sheets for date ranges, transaction types, and categories
