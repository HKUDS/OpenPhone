launch_behavior: always_home
common_tasks:
- Browse the music library by tracks, albums, artists, playlists, or folders
- Search for specific songs, artists, or albums
- Sort the music library by title, album, artist, duration, or date added
- Customize the app theme and select background options
- Adjust audio effects like bass boost, virtualizer, and equalizer presets
- Set a sleep timer to stop music playback after a specified duration
- Share and receive music tracks using the Pi Power Share feature
- Browse and search for podcasts and audiobooks
- Purchase PRO upgrades, remove ads, or buy theme packs in the in-app store
- Submit feedback, report bugs, or request new features
known_limitations:
- Main library screens frequently display banners prompting users to upgrade to PRO
- App displays ads which can only be removed via the in-app store
- Search and library screens show empty state messages if no local music is found
  or no results match the query
- Navigation drawer is densely packed with categories, tools, and settings, potentially
  requiring scrolling
- Certain theme customizations and background packs are locked behind paid in-app
  purchases
